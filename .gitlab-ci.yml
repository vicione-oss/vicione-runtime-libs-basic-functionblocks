      name: "Analysis Pack"
      stage: pack
      rules: *rules_always
      publish_job: "Analysis Publish"
      metadata_job: "Analysis Metadata"
      build_dir: "artifacts/Analysis"
      metadata_dir: "metadata/Analysis"
      before_script:
        - apt update
        - apt install jq zip -y
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.1.1
    inputs:
      name: "Analysis Push (dev)"
      stage: publish
      rules: *rules_not_tags_manual
      repository: "vicione-suite-dev"
      upload_path: "fbs/ViciOne.Analysis"
      needs:
        - "Analysis Metadata"
        - "Analysis Pack"
      artifacts:
