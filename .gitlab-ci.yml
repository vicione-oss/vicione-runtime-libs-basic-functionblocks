.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_tag_manual: &rule_tag_manual
  <<: *rule_tag
  when: manual
  allow_failure: true

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_default_branch_manual: &rule_default_branch_manual
  <<: *rule_default_branch
  when: manual
  allow_failure: true

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_mr_manual: &rule_mr_manual
  <<: *rule_mr
  when: manual
  allow_failure: true

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rule_web_manual: &rule_web_manual
  <<: *rule_web
  when: manual
  allow_failure: true

.rules_always: &rules_always
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - *rule_tag_manual
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.rules_not_tags: &rules_not_tags
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_only_tags_manual: &rules_only_tags_manual
  - *rule_tag_manual

.rules_not_tags_manual: &rules_not_tags_manual
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.rules_tags_else_manual: &rules_tags_else_manual
  - *rule_tag
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.exec_matrix: &exec_matrix
  - OS: linux
    ARCH: [x64, arm64]
  - OS: win
    ARCH: [x64]

variables:
  DOTNET_IMAGE: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest

.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

stages:
  - build
  - test
  - pack
  - publish
  - release

include:
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/version-calc@v1.2.0
    inputs:
      rules: *rules_always
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/runtime-identifier@v0.2.0
    inputs:
      rules: *rules_always
      project: "src/ViciOne.Analysis/ViciOne.Analysis.csproj"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@v2.7.1
    inputs:
      image: ${DOTNET_IMAGE}
      rules: *rules_always
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@v2.7.1
    inputs:
      image: ${DOTNET_IMAGE}
      before_script:
        - *activate_mise
      rules: *rules_always
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@1.1.0
    inputs:
      image: ${DOTNET_IMAGE}
      rules: *rules_not_tags
      build_job_name: "dotnet Build"
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - dotnet restore
      coverage_report_pattern: "artifacts/tests/*/coverage.cobertura.xml"
  # ViciOne.Analysis
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/metadata@v0.2.0
    inputs:
      name: "Analysis Metadata"
      stage: build
      rules: *rules_always
      project: "src/ViciOne.Analysis/ViciOne.Analysis.csproj"
      module_version: "${Version}"
      metadata_json: "src/ViciOne.Analysis/metadata.json"
      metadata_dir: "metadata/Analysis"
      min_core_version_file: "VERSION_CORE"
      min_core_version_property: "MinCoreVersion"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-publish@v2.7.1
    inputs:
      image: ${DOTNET_IMAGE}
      name: "Analysis Publish"
      stage: pack
      rules: *rules_tags_else_manual
      project: "src/ViciOne.Analysis/ViciOne.Analysis.csproj"
      output_directory: "artifacts/Analysis/${OS}-${ARCH}"
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
        - dotnet restore
      execution_matrix: *exec_matrix
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/package-module@v0.2.0
